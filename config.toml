base_url = "https://gazedo.github.io"
title = "Hayden Connor"
description = "Embedded systems engineer — climate tech, distributed sensing, Rust"
default_language = "en"
theme = "serene"
output_dir = "public"
compile_sass = true
minify_html = false
build_search_index = false
generate_feeds = false
feed_filenames = ["feed.xml"]
taxonomies = [{ name = "tags" }, { name = "categories" }]

[markdown]
render_emoji = false
external_links_target_blank = true
external_links_no_follow = true
external_links_no_referrer = true
smart_punctuation = false
github_alerts = true

[markdown.highlighting]
style = "class"
light_theme = "github-light"
dark_theme = "github-dark"

[slugify]
paths = "on"
taxonomies = "on"
anchors = "on"

#=============================================================================

[extra]

sections = [
  { name = "projects", path = "/projects", is_external = false },
  { name = "posts",    path = "/posts",    is_external = false },
  # Uncomment once blog is live:
  # { name = "github", path = "https://github.com/gazedo", is_external = true },
]
blog_section_path = "/posts"

back_link_text = "Back"
force_theme = false   # false | "light" | "dark"

footer_copyright = "© 2025 Hayden Connor"
footer_credits = true

not_found_error_text = "404 Not Found"
not_found_recover_text = "« back to home »"

reaction = false
